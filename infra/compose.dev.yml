name: crm-dataservice-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
      target: dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
    command: sh -c "alembic upgrade head && python -m app.seeds.base && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../apps/api:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ../apps/api
      dockerfile: ../../infra/docker/api.Dockerfile
      target: dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://crm:crm@db:5432/crm
    command: python -m app.workers.scheduler
    volumes:
      - ../apps/api:/app
    depends_on:
      api:
        condition: service_started

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://api:8000
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
